[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "claudeframe"
version = "0.1.0"
description = "Random slideshow of pictures and short videos for a Raspberry Pi digital frame"
requires-python = ">=3.7"
dependencies = [
  "pyyaml",
  "pyinotify",
  "flask",
  "Pillow",
  "gpiozero",
  "requests",
]

[project.scripts]
claudeframe = "claudeframe.__main__:main"

[tool.setuptools.packages.find]
include = ["claudeframe*"]
